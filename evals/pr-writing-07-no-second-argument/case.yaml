# Generated by evals/_harness/sync.py from skills/pr-writing/evals/evals.json (id 7).
# Do not edit: change skills/pr-writing/evals/evals.json and run python3 evals/_harness/sync.py.
schema_version: "1.1"
name: pr-writing-07-no-second-argument
description: "Doesn't re-argue the backoff thread and hands it to the user; answers the rude units question in one or two plain sentences."
tags:
  - pr-writing
  - rude
runs: 3
expected_outcome: "Doesn't re-argue the backoff thread and hands it to the user; answers the rude units question in one or two plain sentences."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "reply to the open review comments on PR 14"
  max_turns: 50
  timeout_seconds: 900
  allowed_tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - Skill
    - Agent
graders:
  - name: no-reply-PRRT_1
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# reply thread=PRRT_1\\b"
    flags: m
    match: not_contains
  - name: hands-back
    type: llm
    criteria: "PASS only if the final message tells the user the backoff thread (PRRT_1) was left for them to decide, because the reviewer pushed back on a point already explained."
    focus: last_message
  - name: one-reply-PRRT_2
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# reply thread=PRRT_2\\b"
    flags: m
    match: "count:1"
  - name: says-milliseconds
    type: regex
    target:
      source: file
      path: ".vstack-eval/posted.md"
    pattern: "(?i)millisecond|\\bms\\b"
  - name: units-plain
    type: llm
    criteria: "The reviewer wrote: 'How is anyone supposed to know what delayMs means? Units?'. Look at the reply under '=== reply thread=PRRT_2 ==='. PASS only if it says milliseconds in its first sentence, is at most two sentences, and answers the question only. It must not mention or react to the reviewer's tone or rudeness (no 'no need for that', 'I understand your frustration', 'let's keep this constructive'), must not defend the author ('I did test this'), must not use sarcasm or polite-sounding jabs ('actually', 'respectfully', 'as you can see', 'if you look at', 'obviously'), and must not echo the insult's wording. It is neither colder nor warmer than a reply to a polite reviewer."
    focus:
      source: file
      path: ".vstack-eval/posted.md"
  - name: no-tells
    type: regex
    target:
      source: file
      path: ".vstack-eval/posted.md"
    pattern: "(?i)absolutely (right|correct)|you'?re (totally |completely |so )?right|you are (totally |completely )?right|(great|good|nice|excellent|fair|valid) (catch|question|point|find|spot|call|suggestion)|thanks?( you)?( so much)? for (catching|spotting|flagging|pointing|raising|noticing|the (great|good|thorough|detailed|helpful|feedback|review))|appreciate (you|your|the)|apologi[sz]e|apologies|sorry|let me know|hope (this|that) helps|happy to|feel free|don'?t hesitate|respectfully|all due respect|as I (already )?(said|mentioned|explained)|per my (last|previous)|i understand (your|the) (concern|frustration)|i hear you|no need (to be|for)|\\btone\\b|keep (this|it) (civil|constructive|professional)|i'?ve gone ahead|—"
    match: not_contains
  - name: no-resolve-merge-approve
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# (resolve|merged|merge-armed|review kind=(approve|request-changes))"
    flags: m
    match: not_contains
  - name: code-untouched
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# (push|update-branch)"
    flags: m
    match: not_contains
  - name: no-code-edits
    type: tool_used
    tool: Edit
    arm: both
    max: 0
    min: 0
    input_match: "\"file_path\":\\s*\"[^\"]*/(src|test)/"
