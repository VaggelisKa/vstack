schema_version: "1.1"
name: review-02-trivial-docs-change
description: "Uses uncommitted changes as the scope, recognises a trivial docs-only change, runs exactly one cheap reviewer, and reports Ship (unless that reviewer finds a real issue)."
tags:
  - review
  - smoke
runs: 3
expected_outcome: "Uses uncommitted changes as the scope, recognises a trivial docs-only change, runs exactly one cheap reviewer, and reports Ship (unless that reviewer finds a real issue)."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/vstack:review my uncommitted changes. I just fixed a typo in docs/setup.md (3 lines); no PR is open for this branch yet."
  max_turns: 80
  timeout_seconds: 1500
  allowed_tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - Skill
    - Agent
graders:
  - name: docs-unchanged
    type: regex
    target:
      source: file
      path: docs/setup.md
    pattern: "Install Node 20[\\s\\S]*no dependencies\\."
  - name: one-reviewer
    type: tool_used
    tool: Agent
    arm: both
    min: 0
    max: 1
  - name: decision-ship
    type: regex
    target: last_message
    pattern: "\\bShip\\b"
    flags: i
  - name: no-pr-comments
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# (comment|reply|review|resolve)"
    flags: m
    match: not_contains
  - name: no-push
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# push"
    flags: m
    match: not_contains
  - name: no-commit
    type: tool_used
    tool: Bash
    arm: both
    max: 0
    min: 0
    input_match: "git (commit|push|stash|reset|checkout)\\b"
  - name: expect-1
    type: llm
    focus: trace
    criteria: "The user's request was:\n/vstack:review my uncommitted changes. I just fixed a typo in docs/setup.md (3 lines); no PR is open for this branch yet.\n\nThe intended outcome: Uses uncommitted changes as the scope, recognises a trivial docs-only change, runs exactly one cheap reviewer, and reports Ship (unless that reviewer finds a real issue).\n\nPASS only if the trace shows this held: Uses git diff HEAD (uncommitted changes) as the scope\nFAIL if it did not hold, or if the trace does not show enough to tell."
  - name: expect-3
    type: llm
    focus: trace
    criteria: "The user's request was:\n/vstack:review my uncommitted changes. I just fixed a typo in docs/setup.md (3 lines); no PR is open for this branch yet.\n\nThe intended outcome: Uses uncommitted changes as the scope, recognises a trivial docs-only change, runs exactly one cheap reviewer, and reports Ship (unless that reviewer finds a real issue).\n\nPASS only if the trace shows this held: Uses the cheap tier (e.g. haiku / low effort) for that reviewer\nFAIL if it did not hold, or if the trace does not show enough to tell."
