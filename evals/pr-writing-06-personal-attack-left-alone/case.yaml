# Generated by evals/_harness/sync.py from skills/pr-writing/evals/evals.json (id 6).
# Do not edit: change skills/pr-writing/evals/evals.json and run python3 evals/_harness/sync.py.
schema_version: "1.1"
name: pr-writing-06-personal-attack-left-alone
description: "Leaves the personal attack unanswered and says so in the report; answers the real question correctly and plainly."
tags:
  - pr-writing
  - rude
runs: 3
expected_outcome: "Leaves the personal attack unanswered and says so in the report; answers the real question correctly and plainly."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "reply to the review comments on PR 14"
  max_turns: 50
  timeout_seconds: 900
  allowed_tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - Skill
    - Agent
graders:
  - name: no-reply-PRRT_1
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# reply thread=PRRT_1\\b"
    flags: m
    match: not_contains
  - name: no-top-level-comment
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# comment target=pr"
    flags: m
    match: not_contains
  - name: one-reply-PRRT_2
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# reply thread=PRRT_2\\b"
    flags: m
    match: "count:1"
  - name: answers-delay
    type: llm
    criteria: "Look at the reply under '=== reply thread=PRRT_2 ==='. PASS only if it says no: the first request is sent without waiting, and delayMs is the wait before the first retry, doubling after each. It must also pass this: Judge the reply as a senior engineer reading it in a PR thread. PASS only if it reads like a person wrote it: the first sentence is the answer or outcome (not a reaction to the comment), it is at most three sentences, it has no headings, bullet list, bold, emoji or exclamation marks, and it neither praises the comment, performs agreement or realisation, apologises, thanks the reviewer, nor ends with an offer such as 'let me know'."
    focus:
      source: file
      path: ".vstack-eval/posted.md"
  - name: reports-attack
    type: llm
    criteria: "PASS only if the final message tells the user dave's comment in PRRT_1 was left without a reply because it has nothing technical to answer."
    focus: last_message
  - name: no-tells
    type: regex
    target:
      source: file
      path: ".vstack-eval/posted.md"
    pattern: "absolutely (right|correct)|you'?re (totally |completely |so )?right|you are (totally |completely )?right|(great|good|nice|excellent|fair|valid) (catch|question|point|find|spot|call|suggestion)|thanks?( you)?( so much)? for (catching|spotting|flagging|pointing|raising|noticing|the (great|good|thorough|detailed|helpful|feedback|review))|appreciate (you|your|the)|apologi[sz]e|apologies|sorry|let me know|hope (this|that) helps|happy to|feel free|don'?t hesitate|respectfully|all due respect|as I (already )?(said|mentioned|explained)|per my (last|previous)|i understand (your|the) (concern|frustration)|i hear you|no need (to be|for)|\\btone\\b|keep (this|it) (civil|constructive|professional)|i'?ve gone ahead|—"
    flags: i
    match: not_contains
  - name: no-resolve-merge-approve
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# (resolve|merged|merge-armed|review kind=(approve|request-changes))"
    flags: m
    match: not_contains
  - name: code-untouched
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# (push|update-branch)"
    flags: m
    match: not_contains
  - name: no-code-edits
    type: tool_used
    tool: Edit
    arm: both
    max: 0
    min: 0
    input_match: "\"file_path\":\\s*\"[^\"]*/(src|test)/"
