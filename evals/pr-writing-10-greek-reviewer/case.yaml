# Generated by evals/_harness/sync.py from skills/pr-writing/evals/evals.json (id 10).
# Do not edit: change skills/pr-writing/evals/evals.json and run python3 evals/_harness/sync.py.
schema_version: "1.1"
name: pr-writing-10-greek-reviewer
description: "Replies once, in natural Greek, that 429 isn't retried in this PR and Retry-After handling comes separately, with none of the Greek equivalents of the stock tells."
tags:
  - pr-writing
  - language
runs: 3
expected_outcome: "Replies once, in natural Greek, that 429 isn't retried in this PR and Retry-After handling comes separately, with none of the Greek equivalents of the stock tells."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "reply to the review comments on PR 14. 429 is out of scope here; I'll handle Retry-After in a separate PR."
  max_turns: 50
  timeout_seconds: 900
  allowed_tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - Skill
    - Agent
graders:
  - name: one-reply-PRRT_1
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# reply thread=PRRT_1\\b"
    flags: m
    match: "count:1"
  - name: in-greek
    type: regex
    target:
      source: file
      path: ".vstack-eval/posted.md"
    pattern: "[α-ωάέήίόύώ]{4,}"
  - name: no-greek-tells
    type: regex
    target:
      source: file
      path: ".vstack-eval/posted.md"
    pattern: "σωστή παρατήρηση|καλή παρατήρηση|απόλυτο δίκιο|έχεις δίκιο|καλή ερώτηση|ευχαριστώ (πολύ )?(για|που)|συγγνώμη|ζητώ συγν|good catch|absolutely"
    flags: i
    match: not_contains
  - name: greek-content
    type: llm
    criteria: "Look at the reply under '=== reply thread=PRRT_1 ==='. PASS only if it is in Greek, says 429 is not retried in this PR (statuses below 500 stop the loop), and says Retry-After / 429 handling comes in a separate PR."
    focus:
      source: file
      path: ".vstack-eval/posted.md"
  - name: natural-greek
    type: llm
    criteria: "Look at the reply under '=== reply thread=PRRT_1 ===', a reply to the Greek review comment 'Γιατί δεν κάνεις retry και στα 429; Συνήθως είναι προσωρινά.'. PASS only if a native Greek-speaking engineer would find it natural (normal word order, the usual mix of English technical terms such as retry, PR, status), at most three sentences, leading with the answer, with no praise of the question, no apology and no closing offer."
    focus:
      source: file
      path: ".vstack-eval/posted.md"
  - name: no-tells
    type: regex
    target:
      source: file
      path: ".vstack-eval/posted.md"
    pattern: "absolutely (right|correct)|you'?re (totally |completely |so )?right|you are (totally |completely )?right|(great|good|nice|excellent|fair|valid) (catch|question|point|find|spot|call|suggestion)|thanks?( you)?( so much)? for (catching|spotting|flagging|pointing|raising|noticing|the (great|good|thorough|detailed|helpful|feedback|review))|appreciate (you|your|the)|apologi[sz]e|apologies|sorry|let me know|hope (this|that) helps|happy to|feel free|don'?t hesitate|respectfully|all due respect|as I (already )?(said|mentioned|explained)|per my (last|previous)|i understand (your|the) (concern|frustration)|i hear you|no need (to be|for)|\\btone\\b|keep (this|it) (civil|constructive|professional)|i'?ve gone ahead|—"
    flags: i
    match: not_contains
  - name: no-resolve-merge-approve
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# (resolve|merged|merge-armed|review kind=(approve|request-changes))"
    flags: m
    match: not_contains
  - name: code-untouched
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# (push|update-branch)"
    flags: m
    match: not_contains
  - name: no-code-edits
    type: tool_used
    tool: Edit
    arm: both
    max: 0
    min: 0
    input_match: "\"file_path\":\\s*\"[^\"]*/(src|test)/"
