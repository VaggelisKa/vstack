# Generated by evals/_harness/sync.py from skills/pr-writing/evals/evals.json (id 4).
# Do not edit: change skills/pr-writing/evals/evals.json and run python3 evals/_harness/sync.py.
schema_version: "1.1"
name: pr-writing-04-description-from-template
description: "Updates the PR with a specific imperative title and a short description in the repo template's headings, with the reason taken from the commit and nothing invented."
tags:
  - pr-writing
  - smoke
runs: 3
expected_outcome: "Updates the PR with a specific imperative title and a short description in the repo template's headings, with the reason taken from the commit and nothing invented."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "PR 14 has a placeholder title and description. Write proper ones and update the PR."
  max_turns: 50
  timeout_seconds: 900
  allowed_tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - Skill
    - Agent
graders:
  - name: title-edited
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# edit title=.{12,71}$"
    flags: m
  - name: body-edited
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# edit body="
    flags: m
  - name: template-headings
    type: regex
    target:
      source: file
      path: ".vstack-eval/posted.md"
    pattern: "## What[\\s\\S]*## Why[\\s\\S]*## How to test"
  - name: no-template-comments
    type: regex
    target:
      source: file
      path: ".vstack-eval/posted.md"
    pattern: "<!--"
    match: not_contains
  - name: no-marketing
    type: regex
    target:
      source: file
      path: ".vstack-eval/posted.md"
    pattern: "(?i)robust|seamless|comprehensive|leverag|enhanc|streamlin|\\bdelve|🚀|✨|✅|📝|🎉"
    match: not_contains
  - name: docs-unticked
    type: regex
    target:
      source: file
      path: ".vstack-eval/posted.md"
    pattern: "(?i)\\[x\\]\\s*Docs updated"
    match: not_contains
  - name: title-specific
    type: llm
    criteria: "Look at the text under '=== edit title ==='. PASS only if it is in the imperative, under 72 characters, and says the client now retries 5xx responses with (exponential) backoff. FAIL for a vague title like 'Retry improvements' or 'Update client'."
    focus:
      source: file
      path: ".vstack-eval/posted.md"
  - name: why-from-commit
    type: llm
    criteria: "Look at the text under '=== edit body ==='. PASS only if its Why section gives the reason from the commit message: 503s from the gateway during deploys make the exports job fail, and they clear quickly. FAIL if it adds a motivation that isn't in that reason (for example 'improve reliability across the app', 'best practice')."
    focus:
      source: file
      path: ".vstack-eval/posted.md"
  - name: says-what-reviewers-need
    type: llm
    criteria: "Look at the text under '=== edit body ==='. PASS only if it says 4xx responses are still not retried, says how many attempts and how the delay grows (or names the attempts/delayMs options), and does not list the changed files one by one."
    focus:
      source: file
      path: ".vstack-eval/posted.md"
  - name: no-tells
    type: regex
    target:
      source: file
      path: ".vstack-eval/posted.md"
    pattern: "(?i)absolutely (right|correct)|you'?re (totally |completely |so )?right|you are (totally |completely )?right|(great|good|nice|excellent|fair|valid) (catch|question|point|find|spot|call|suggestion)|thanks?( you)?( so much)? for (catching|spotting|flagging|pointing|raising|noticing|the (great|good|thorough|detailed|helpful|feedback|review))|appreciate (you|your|the)|apologi[sz]e|apologies|sorry|let me know|hope (this|that) helps|happy to|feel free|don'?t hesitate|respectfully|all due respect|as I (already )?(said|mentioned|explained)|per my (last|previous)|i understand (your|the) (concern|frustration)|i hear you|no need (to be|for)|\\btone\\b|keep (this|it) (civil|constructive|professional)|i'?ve gone ahead|—"
    match: not_contains
