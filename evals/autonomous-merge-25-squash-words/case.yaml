schema_version: "1.1"
name: autonomous-merge-25-squash-words
description: "A plain merge ask; 'squash' doesn't pick the method, gate.py does (squash here). Merges and reports the method."
tags:
  - autonomous-merge
  - merge-intent
runs: 3
expected_outcome: "A plain merge ask; 'squash' doesn't pick the method, gate.py does (squash here). Merges and reports the method."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/vstack:autonomous-merge 14 and squash merge it. The repo allows merge commits and squash."
  max_turns: 150
  timeout_seconds: 2400
  allowed_tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - Skill
    - Agent
  append_system_prompt: "This is a non-interactive evaluation run in a sandbox: nobody will answer questions, no time passes between your polls, and there is no way to schedule a wake-up. Where a skill says to wait for the next poll, poll once more right away; if nothing changed, stop and write the final report as the skill describes."
graders:
  - name: init-merge
    type: regex
    target: trace
    pattern: "state\\.py\\\\?\\\"?\\s+init\\s+--pr\\s+14\\s+--merge"
  - name: gate-merge
    type: regex
    target: trace
    pattern: "gate\\.py\\\\?\\\"?\\s+14\\s+--merge"
  - name: armed-pinned-to-head
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^gh pr merge .*--match-head-commit[ =]?[0-9a-f]{40}"
    flags: m
  - name: merged-on-head
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# merged method=\\w+ head=[0-9a-f]{40}$"
    flags: m
  - name: no-admin
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "--admin\\b"
    flags: m
    match: not_contains
  - name: no-refused-merge
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# refused"
    flags: m
    match: not_contains
  - name: no-own-method-flag
    type: tool_used
    tool: Bash
    arm: both
    max: 0
    min: 0
    input_match: "gh pr merge[^\\n]*--(squash|rebase)"
  - name: states-method
    type: regex
    target: last_message
    pattern: "(?i)\\b(squash|merge commit|method)\\b"
    flags: i
  - name: runs-babysit
    type: regex
    target: trace
    pattern: "\"skill\":\\s*\"vstack:babysit\""
  - name: babysit-not-asked-to-merge
    type: regex
    target: trace
    pattern: "\"skill\":\\s*\"vstack:babysit\",\\s*\"args\":\\s*\"(\\S+\\s+(--)?merge\\b|[^\"]*--merge\\b)"
    match: not_contains
