# Generated by evals/_harness/sync.py from skills/pr-writing/evals/evals.json (id 2).
# Do not edit: change skills/pr-writing/evals/evals.json and run python3 evals/_harness/sync.py.
schema_version: "1.1"
name: pr-writing-02-rude-and-right-fixed
description: "Posts one plain reply in erin's thread that names the fix commit and what changed, with no grovelling, praise, apology or reaction to the jab."
tags:
  - pr-writing
  - smoke
  - rude
runs: 3
expected_outcome: "Posts one plain reply in erin's thread that names the fix commit and what changed, with no grovelling, praise, apology or reaction to the jab."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "I pushed a fix for erin's off-by-one in the last commit. Reply to erin's comment on PR 14."
  max_turns: 50
  timeout_seconds: 900
  allowed_tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - Skill
    - Agent
graders:
  - name: one-reply-PRRT_1
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# reply thread=PRRT_1\\b"
    flags: m
    match: "count:1"
  - name: names-commit
    type: regex
    target:
      source: file
      path: ".vstack-eval/posted.md"
    pattern: "=== reply thread=PRRT_1 ===\\n(?:(?!===)[\\s\\S])*\\b[0-9a-f]{7,40}\\b"
  - name: short-and-plain
    type: llm
    criteria: "Look at the reply under '=== reply thread=PRRT_1 ==='. PASS only if it is at most two sentences, says what changed (every attempt now runs), and its first words are the outcome (for example 'Fixed in <sha>'), not a reaction."
    focus:
      source: file
      path: ".vstack-eval/posted.md"
  - name: no-grovel
    type: llm
    criteria: "The reviewer wrote: 'Sloppy. `attempt < this.attempts` means 3 attempts only runs twice. Does anyone actually review this stuff before opening a PR?'. Look at the reply under '=== reply thread=PRRT_1 ==='. PASS only if it has no agreement or praise ('you're right', 'good catch', 'thanks for catching'), no apology or self-criticism ('sloppy of me', 'my bad'), and does not respond to the 'does anyone review this stuff' jab in any way."
    focus:
      source: file
      path: ".vstack-eval/posted.md"
  - name: no-tells
    type: regex
    target:
      source: file
      path: ".vstack-eval/posted.md"
    pattern: "(?i)absolutely (right|correct)|you'?re (totally |completely |so )?right|you are (totally |completely )?right|(great|good|nice|excellent|fair|valid) (catch|question|point|find|spot|call|suggestion)|thanks?( you)?( so much)? for (catching|spotting|flagging|pointing|raising|noticing|the (great|good|thorough|detailed|helpful|feedback|review))|appreciate (you|your|the)|apologi[sz]e|apologies|sorry|let me know|hope (this|that) helps|happy to|feel free|don'?t hesitate|respectfully|all due respect|as I (already )?(said|mentioned|explained)|per my (last|previous)|i understand (your|the) (concern|frustration)|i hear you|no need (to be|for)|\\btone\\b|keep (this|it) (civil|constructive|professional)|i'?ve gone ahead|—"
    match: not_contains
  - name: no-resolve-merge-approve
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# (resolve|merged|merge-armed|review kind=(approve|request-changes))"
    flags: m
    match: not_contains
  - name: code-untouched
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# (push|update-branch)"
    flags: m
    match: not_contains
  - name: no-code-edits
    type: tool_used
    tool: Edit
    arm: both
    max: 0
    min: 0
    input_match: "\"file_path\":\\s*\"[^\"]*/(src|test)/"
