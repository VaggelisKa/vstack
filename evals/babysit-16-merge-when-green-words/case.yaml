schema_version: "1.1"
name: babysit-16-merge-when-green-words
description: "The plain-words ask turns merge mode on. Merges once every gate passes."
tags:
  - babysit
  - merge-intent
runs: 3
expected_outcome: "The plain-words ask turns merge mode on. Merges once every gate passes."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "babysit PR 14 and merge when green."
  max_turns: 80
  timeout_seconds: 1200
  allowed_tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - Skill
    - Agent
  append_system_prompt: "This is a non-interactive evaluation run in a sandbox: nobody will answer questions, no time passes between your polls, and there is no way to schedule a wake-up. Where a skill says to wait for the next poll, poll once more right away; if nothing changed, stop and write the final report as the skill describes."
graders:
  - name: reads-merge-md
    type: regex
    target: trace
    pattern: "\"(command|file_path)\":\\s*\"[^\"]*babysit/merge\\.md"
  - name: armed-pinned-to-head
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^gh pr merge .*--match-head-commit[ =]?[0-9a-f]{40}"
    flags: m
  - name: merged-on-head
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# merged method=\\w+ head=[0-9a-f]{40}$"
    flags: m
  - name: no-admin
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "--admin\\b"
    flags: m
    match: not_contains
  - name: no-refused-merge
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# refused"
    flags: m
    match: not_contains
  - name: no-autonomous-merge
    type: tool_used
    tool: Skill
    arm: both
    input_match: "\"skill\":\\s*\"(vstack:)?autonomous-merge\""
    min: 0
    max: 0
