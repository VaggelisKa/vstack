graders:
  - name: survey-in-prompt
    type: regex
    target: trace
    pattern: "Map the codebase first"
  - name: finds-with-retry
    type: regex
    target: last_message
    pattern: "withRetry|util/retry\\.js"
    flags: i
  - name: consistency-grade
    type: regex
    target: last_message
    pattern: Consistency
    flags: i
    weight: 0.5
  - name: no-pr-comments
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# (comment|reply|review|resolve)"
    flags: m
    match: not_contains
  - name: no-push
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# push"
    flags: m
    match: not_contains
  - name: no-commit
    type: tool_used
    tool: Bash
    arm: both
    max: 0
    min: 0
    input_match: "git (commit|push|stash|reset|checkout)\\b"
