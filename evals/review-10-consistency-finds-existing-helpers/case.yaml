runs: 3
expected_outcome: "The consistency reviewer surveys the codebase before judging, finds the shared helpers the change re-implements (withRetry in src/util/retry.js, HttpError in src/util/errors.js, the reply/replies test helpers in test/helpers.js) and the fetchOrder/fetchAccount naming of the closest analogues, and reports them as reuse and naming findings with the existing code's paths, alongside a consistency grade."
