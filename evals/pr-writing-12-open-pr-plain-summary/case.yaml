schema_version: "1.1"
name: pr-writing-12-open-pr-plain-summary
description: "Starts pr-writing, opens the PR with gh pr create, with a specific imperative title and a body that summarises the behaviour change and its reason in a few sentences, without file lists, signatures, defaults or a diagram."
tags:
  - pr-writing
  - smoke
  - trigger
runs: 3
expected_outcome: "Starts pr-writing, opens the PR with gh pr create, with a specific imperative title and a body that summarises the behaviour change and its reason in a few sentences, without file lists, signatures, defaults or a diagram."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "I'm done with this branch. Open a PR for it."
  max_turns: 50
  timeout_seconds: 900
  allowed_tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - Skill
    - Agent
graders:
  - name: fires
    type: tool_used
    tool: Skill
    arm: both
    input_match: "\"skill\":\\s*\"(vstack:)?pr-writing\""
    min: 1
  - name: pr-created
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# create title=.{12,71} draft="
    flags: m
  - name: no-file-list
    type: regex
    target:
      source: file
      path: ".vstack-eval/posted.md"
    pattern: "^\\s*[-*]\\s+(updated?|added|modified|changed|new)?\\s*`?[\\w.-]*/[\\w./-]+\\.\\w{1,5}`?\\s*($|[:(-])"
    flags: im
    match: not_contains
  - name: no-signature-or-defaults
    type: regex
    target:
      source: file
      path: ".vstack-eval/posted.md"
    pattern: "delayMs\\s*[=:]|attempts\\s*[=:]\\s*\\d|\\*\\s*2\\s*\\*\\*|constructor\\("
    flags: i
    match: not_contains
  - name: no-diagram
    type: regex
    target:
      source: file
      path: ".vstack-eval/posted.md"
    pattern: "```\\s*(mermaid|text)"
    match: not_contains
  - name: summary-quality
    type: llm
    criteria: "Look at the text under '=== create body ==='. PASS only if, in about 120 words or fewer, it says what changes for callers (server errors retried with a growing wait, client errors still not retried) and why (503s from the gateway during deploys fail the exports job), and reads as a summary rather than a spec: no list of files, no signatures, option defaults or formulas, and no Summary/Changes/Test plan headings."
    focus:
      source: file
      path: ".vstack-eval/posted.md"
  - name: expect-6
    type: llm
    focus: trace
    criteria: "The user's request was:\nI'm done with this branch. Open a PR for it.\n\nThe intended outcome: Starts pr-writing, opens the PR with gh pr create, with a specific imperative title and a body that summarises the behaviour change and its reason in a few sentences, without file lists, signatures, defaults or a diagram.\n\nPASS only if the trace shows this held: The body doesn't claim tests passed unless the trace shows them run and passing in this session\nFAIL if it did not hold, or if the trace does not show enough to tell."
