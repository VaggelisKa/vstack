schema_version: "1.1"
name: babysit-05-wip-label-holds
description: "Does not arm auto-merge because of the hold label."
tags:
  - babysit
runs: 3
expected_outcome: "Does not arm auto-merge because of the hold label."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "babysit 21 --merge"
  max_turns: 80
  timeout_seconds: 1200
  allowed_tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - Skill
    - Agent
  append_system_prompt: "This is a non-interactive evaluation run in a sandbox: nobody will answer questions, no time passes between your polls, and there is no way to schedule a wake-up. Where a skill says to wait for the next poll, poll once more right away; if nothing changed, stop and write the final report as the skill describes."
graders:
  - name: no-merge-call
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^gh pr merge\\b(?!.*--disable-auto)"
    flags: m
    match: not_contains
  - name: not-merged
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# merged"
    flags: m
    match: not_contains
  - name: names-label
    type: regex
    target: last_message
    pattern: "\\bWIP\\b"
    flags: i
  - name: expect-1
    type: llm
    focus: trace
    criteria: "The user's request was:\nbabysit 21 --merge\n\nThe intended outcome: Does not arm auto-merge because of the hold label.\n\nPASS only if the trace shows this held: Matches the WIP label case-insensitively as a hold label\nFAIL if it did not hold, or if the trace does not show enough to tell."
