schema_version: "1.1"
name: babysit-18-no-merge-default
description: "No merge was asked for. Stops at ready and does not merge."
tags:
  - babysit
  - merge-intent
  - smoke
runs: 3
expected_outcome: "No merge was asked for. Stops at ready and does not merge."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/vstack:babysit 14."
  max_turns: 80
  timeout_seconds: 1200
  allowed_tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - Skill
    - Agent
  append_system_prompt: "This is a non-interactive evaluation run in a sandbox: nobody will answer questions, no time passes between your polls, and there is no way to schedule a wake-up. Where a skill says to wait for the next poll, poll once more right away; if nothing changed, stop and write the final report as the skill describes."
graders:
  - name: no-full-merge-md
    type: tool_used
    tool: Read
    arm: both
    max: 0
    min: 0
    input_match: "babysit/merge\\.md\"(?!.*\"limit\")"
  - name: no-cat-merge-md
    type: tool_used
    tool: Bash
    arm: both
    max: 0
    min: 0
    input_match: "\\bcat\\b[^|;&]*babysit/merge\\.md"
  - name: no-merge-call
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^gh pr merge\\b(?!.*--disable-auto)"
    flags: m
    match: not_contains
  - name: not-merged
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# merged"
    flags: m
    match: not_contains
  - name: says-how-to-merge
    type: regex
    target: last_message
    pattern: "/(vstack:)?babysit 14 (merge|--merge)\\b"
    flags: i
  - name: no-autonomous-merge
    type: tool_used
    tool: Skill
    arm: both
    input_match: "\"skill\":\\s*\"(vstack:)?autonomous-merge\""
    min: 0
    max: 0
