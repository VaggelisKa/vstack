runs: 3
expected_outcome: "Lists the uncommitted change with the default scope, decides only the in-scope comments using the rubric, applies, verifies, and reports. Pre-existing committed comments are untouched; agent tells, banners, narration and commented-out code on added lines are deleted; the rate-limit and Safari workaround comments survive (the first shortened); the eslint-disable directive stays byte-identical and is listed as needing a reason. Nothing is committed."
context:
