    type: regex
    target:
      source: file
      path: src/client.ts
    pattern: "Added retry logic with exponential backoff"
    match: not_contains
  - name: deletes-banner
    type: regex
    target:
      source: file
      path: src/client.ts
    pattern: "---- Helpers ----"
    match: not_contains
  - name: deletes-narration
    type: regex
    target:
      source: file
      path: src/client.ts
    pattern: "Loop until we succeed"
    match: not_contains
  - name: deletes-dead-code
    type: regex
    target:
      source: file
      path: src/client.ts
    pattern: "const delay = 100 \\* attempt"
    match: not_contains
  - name: keeps-issue-link
    type: regex
    target:
      source: file
      path: src/client.ts
    pattern: "https://github\\.com/acme/api/issues/412"
  - name: keeps-safari
    type: regex
    target:
      source: file
      path: src/client.ts
    pattern: "// Safari 17 strips custom Authorization headers on redirects:\\n  // https://bugs\\.webkit\\.org/show_bug\\.cgi\\?id=230255"
  - name: keeps-eslint-directive
    type: regex
    target:
      source: file
      path: src/client.ts
    pattern: "^  // eslint-disable-next-line @typescript-eslint/no-explicit-any$"
    flags: m
  - name: keeps-license
    type: regex
    target:
      source: file
      path: src/client.ts
    pattern: "^// Copyright 2025 Acme Corp\\.\\n// SPDX-License-Identifier: Apache-2\\.0$"
    flags: m
  - name: no-git-writes
    type: tool_used
    tool: Bash
    arm: both
    max: 0
    min: 0
    input_match: "git (add|commit|push|stash)\\b"
