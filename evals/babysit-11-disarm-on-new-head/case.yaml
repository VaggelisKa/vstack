schema_version: "1.1"
name: babysit-11-disarm-on-new-head
description: "Disables auto-merge and returns to the loop."
tags:
  - babysit
runs: 3
expected_outcome: "Disables auto-merge and returns to the loop."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "babysit 27 --merge. You armed auto-merge on the previous head earlier in this session; the author has since pushed a new commit."
  max_turns: 80
  timeout_seconds: 1200
  allowed_tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - Skill
    - Agent
  append_system_prompt: "This is a non-interactive evaluation run in a sandbox: nobody will answer questions, no time passes between your polls, and there is no way to schedule a wake-up. Where a skill says to wait for the next poll, poll once more right away; if nothing changed, stop and write the final report as the skill describes."
graders:
  - name: disarms
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# auto-merge-disabled"
    flags: m
  - name: does-not-rearm
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# merge-armed"
    flags: m
    match: not_contains
  - name: not-merged
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# merged"
    flags: m
    match: not_contains
