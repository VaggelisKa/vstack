# Generated by evals/_harness/sync.py from skills/pr-writing/evals/evals.json (id 3).
# Do not edit: change skills/pr-writing/evals/evals.json and run python3 evals/_harness/sync.py.
schema_version: "1.1"
name: pr-writing-03-many-threads-no-repetition
description: "Replies once in each of the four threads that need an answer, each in its own words and leading with the answer; skips the praise and the already-answered thread; posts no summary comment."
tags:
  - pr-writing
  - smoke
runs: 3
expected_outcome: "Replies once in each of the four threads that need an answer, each in its own words and leading with the answer; skips the praise and the already-answered thread; posts no summary comment."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "reply to the review comments on PR 14. Context: attempts is a client option because every caller of one client talks to the same gateway, so they share one retry policy. I want to keep the backoff expression inline. Retrying network errors is out of scope for this PR. I already pushed the attempt-number change carol asked for."
  max_turns: 50
  timeout_seconds: 900
  allowed_tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - Skill
    - Agent
graders:
  - name: one-reply-PRRT_1
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# reply thread=PRRT_1\\b"
    flags: m
    match: "count:1"
  - name: one-reply-PRRT_2
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# reply thread=PRRT_2\\b"
    flags: m
    match: "count:1"
  - name: one-reply-PRRT_4
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# reply thread=PRRT_4\\b"
    flags: m
    match: "count:1"
  - name: one-reply-PRRT_5
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# reply thread=PRRT_5\\b"
    flags: m
    match: "count:1"
  - name: no-reply-PRRT_3
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# reply thread=PRRT_3\\b"
    flags: m
    match: not_contains
  - name: no-reply-PRRT_6
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# reply thread=PRRT_6\\b"
    flags: m
    match: not_contains
  - name: no-top-level-comment
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# comment target=pr"
    flags: m
    match: not_contains
  - name: no-repetition
    type: llm
    criteria: "The file holds every reply posted in one run, each under a '=== reply thread=<id> ===' line. PASS only if no two replies open with the same two or more words (two replies that both open with a status like 'Fixed in <sha>' are fine), and no sentence, clause or stock phrase appears in more than one reply."
    focus:
      source: file
      path: ".vstack-eval/posted.md"
  - name: each-reads-human
    type: llm
    criteria: "The file holds every reply posted in one run. PASS only if every one of them passes this: Judge the reply as a senior engineer reading it in a PR thread. PASS only if it reads like a person wrote it: the first sentence is the answer or outcome (not a reaction to the comment), it is at most three sentences, it has no headings, bullet list, bold, emoji or exclamation marks, and it neither praises the comment, performs agreement or realisation, apologises, thanks the reviewer, nor ends with an offer such as 'let me know'."
    focus:
      source: file
      path: ".vstack-eval/posted.md"
  - name: keeps-inline-once
    type: llm
    criteria: "Look at the reply under '=== reply thread=PRRT_2 ==='. PASS only if it says the expression stays inline, gives a reason, does not hedge ('I think it might be slightly') and does not offer to change it anyway ('happy to change', 'if you feel strongly', 'up to you')."
    focus:
      source: file
      path: ".vstack-eval/posted.md"
  - name: out-of-scope
    type: llm
    criteria: "Look at the reply under '=== reply thread=PRRT_4 ==='. PASS only if it says retrying network errors is out of scope for this PR, offers a follow-up (an issue or separate PR), and doesn't praise the idea ('great idea', 'good thought')."
    focus:
      source: file
      path: ".vstack-eval/posted.md"
  - name: prrt5-names-commit
    type: regex
    target:
      source: file
      path: ".vstack-eval/posted.md"
    pattern: "=== reply thread=PRRT_5 ===\\n(?:(?!===)[\\s\\S])*\\b[0-9a-f]{7,40}\\b"
  - name: no-tells
    type: regex
    target:
      source: file
      path: ".vstack-eval/posted.md"
    pattern: "absolutely (right|correct)|you'?re (totally |completely |so )?right|you are (totally |completely )?right|(great|good|nice|excellent|fair|valid) (catch|question|point|find|spot|call|suggestion)|thanks?( you)?( so much)? for (catching|spotting|flagging|pointing|raising|noticing|the (great|good|thorough|detailed|helpful|feedback|review))|appreciate (you|your|the)|apologi[sz]e|apologies|sorry|let me know|hope (this|that) helps|happy to|feel free|don'?t hesitate|respectfully|all due respect|as I (already )?(said|mentioned|explained)|per my (last|previous)|i understand (your|the) (concern|frustration)|i hear you|no need (to be|for)|\\btone\\b|keep (this|it) (civil|constructive|professional)|i'?ve gone ahead|—"
    flags: i
    match: not_contains
  - name: no-resolve-merge-approve
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# (resolve|merged|merge-armed|review kind=(approve|request-changes))"
    flags: m
    match: not_contains
  - name: code-untouched
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# (push|update-branch)"
    flags: m
    match: not_contains
  - name: no-code-edits
    type: tool_used
    tool: Edit
    arm: both
    max: 0
    min: 0
    input_match: "\"file_path\":\\s*\"[^\"]*/(src|test)/"
