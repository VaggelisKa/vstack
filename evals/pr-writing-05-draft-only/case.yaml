# Do not edit: change skills/pr-writing/evals/evals.json and run python3 evals/_harness/sync.py.
schema_version: "1.1"
name: pr-writing-05-draft-only
description: "Shows a short, polite draft that corrects dave with the line and test, and posts nothing."
tags:
  - pr-writing
  - rude
runs: 3
expected_outcome: "Shows a short, polite draft that corrects dave with the line and test, and posts nothing."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "what should I say back to dave on PR 14? Draft it, don't post anything."
  max_turns: 50
  timeout_seconds: 900
  allowed_tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - Skill
    - Agent
graders:
  - name: posts-nothing
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# (reply|comment|edit|review)\\b"
    flags: m
    match: not_contains
  - name: draft-shown
    type: llm
    criteria: "PASS only if the final message contains a draft reply to dave's comment ('Did you even run this? It retries 404s forever. This is amateur hour.') that says 404s aren't retried and cites line 17's status < 500 break or the 'get does not retry a 404' test."
    focus: last_message
  - name: draft-polite-plain
    type: llm
    criteria: "Judge only the draft reply in the final message (not the text around it). The reviewer wrote: 'Did you even run this? It retries 404s forever. This is amateur hour.'. PASS only if the draft answers the technical claim only. It must not mention or react to the reviewer's tone or rudeness (no 'no need for that', 'I understand your frustration', 'let's keep this constructive'), must not defend the author ('I did test this'), must not use sarcasm or polite-sounding jabs ('actually', 'respectfully', 'as you can see', 'if you look at', 'obviously'), and must not echo the insult's wording. It is neither colder nor warmer than a reply to a polite reviewer. Judge the reply as a senior engineer reading it in a PR thread. PASS only if it reads like a person wrote it: the first sentence is the answer or outcome (not a reaction to the comment), it is at most three sentences, it has no headings, bullet list, bold, emoji or exclamation marks, and it neither praises the comment, performs agreement or realisation, apologises, thanks the reviewer, nor ends with an offer such as 'let me know'."
    focus: last_message
  - name: fires-on-draft
    type: tool_used
    tool: Skill
    arm: both
    input_match: "\"skill\":\\s*\"(vstack:)?pr-writing\""
    min: 1
