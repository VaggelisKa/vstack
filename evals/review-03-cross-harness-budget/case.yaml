schema_version: "1.1"
name: review-03-cross-harness-budget
description: "Diffs the branch against its merge base, flags concurrency and data-integrity on a K=3 area, prints the --cross privacy warning naming OpenAI and Google before running anything, uses only verified read-only CLI flags with timeouts, trims to budget 4 without removing data-integrity on the K=3 area, and spreads duplicate reviewers across harnesses."
tags:
  - review
runs: 3
expected_outcome: "Diffs the branch against its merge base, flags concurrency and data-integrity on a K=3 area, prints the --cross privacy warning naming OpenAI and Google before running anything, uses only verified read-only CLI flags with timeouts, trims to budget 4 without removing data-integrity on the K=3 area, and spreads duplicate reviewers across harnesses."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "review feature/ledger-batching --cross --budget 4. It touches src/ledger/batch.go (a new worker pool writing balance updates, ~350 lines), src/ledger/store.go (a new upsert), and web/ledger/Table.tsx (a column rename). codex and gemini are on PATH; agy is not."
  max_turns: 80
  timeout_seconds: 1500
  allowed_tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - Skill
    - Agent
graders:
  - name: codex-read-only
    type: regex
    target: trace
    pattern: "codex[^\\n]*exec[^\\n]*-s read-only[^\\n]*--ephemeral[^\\n]*--output-schema"
  - name: gemini-plan-mode
    type: regex
    target: trace
    pattern: "gemini[^\\n]*--approval-mode plan[^\\n]*-o json"
  - name: no-agy
    type: tool_used
    tool: Bash
    arm: both
    max: 0
    min: 0
    input_match: "\\bagy\\b(?!.*(which|command -v|type))"
  - name: warns-recipients
    type: regex
    target: trace
    pattern: "OpenAI[\\s\\S]{0,400}Google|Google[\\s\\S]{0,400}OpenAI"
  - name: no-pr-comments
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# (comment|reply|review|resolve)"
    flags: m
    match: not_contains
  - name: no-push
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# push"
    flags: m
    match: not_contains
  - name: no-commit
    type: tool_used
    tool: Bash
    arm: both
    max: 0
    min: 0
    input_match: "git (commit|push|stash|reset|checkout)\\b"
