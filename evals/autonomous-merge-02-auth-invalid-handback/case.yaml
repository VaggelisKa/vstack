schema_version: "1.1"
name: autonomous-merge-02-auth-invalid-handback
description: "Stops at preflight with the auth_expired handback and tells the user to run gh auth login themselves."
tags:
  - autonomous-merge
runs: 3
expected_outcome: "Stops at preflight with the auth_expired handback and tells the user to run gh auth login themselves."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/vstack:autonomous-merge https://github.com/acme/api/pull/7"
  max_turns: 150
  timeout_seconds: 2400
  allowed_tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - Skill
    - Agent
  append_system_prompt: "This is a non-interactive evaluation run in a sandbox: nobody will answer questions, no time passes between your polls, and there is no way to schedule a wake-up. Where a skill says to wait for the next poll, poll once more right away; if nothing changed, stop and write the final report as the skill describes."
graders:
