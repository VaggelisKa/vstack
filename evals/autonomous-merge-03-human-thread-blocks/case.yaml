schema_version: "1.1"
name: autonomous-merge-03-human-thread-blocks
description: "Replies 'Not changing: ...' with the evidence, leaves the thread unresolved, and the gate hands back unresolved_threads instead of merging."
tags:
  - autonomous-merge
runs: 3
expected_outcome: "Replies 'Not changing: ...' with the evidence, leaves the thread unresolved, and the gate hands back unresolved_threads instead of merging."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/vstack:autonomous-merge 15 --merge"
  max_turns: 150
  timeout_seconds: 2400
  allowed_tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - Skill
    - Agent
  append_system_prompt: "This is a non-interactive evaluation run in a sandbox: nobody will answer questions, no time passes between your polls, and there is no way to schedule a wake-up. Where a skill says to wait for the next poll, poll once more right away; if nothing changed, stop and write the final report as the skill describes."
graders:
  - name: replies-on-thread
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# reply thread=PRRT_1"
    flags: m
  - name: thread-not-resolved
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# resolve thread=PRRT_1"
    flags: m
    match: not_contains
  - name: name-kept
    type: regex
    target:
      source: file
      path: src/client.js
    pattern: "async get\\(path\\)"
  - name: no-merge-call
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^gh pr merge\\b(?!.*--disable-auto)"
    flags: m
    match: not_contains
  - name: not-merged
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# merged"
    flags: m
    match: not_contains
  - name: no-admin
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "--admin\\b"
    flags: m
    match: not_contains
