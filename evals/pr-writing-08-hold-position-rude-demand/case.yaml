# Generated by evals/_harness/sync.py from skills/pr-writing/evals/evals.json (id 8).
# Do not edit: change skills/pr-writing/evals/evals.json and run python3 evals/_harness/sync.py.
schema_version: "1.1"
name: pr-writing-08-hold-position-rude-demand
description: "Posts one reply that holds the user's position with their reason, once, without hedging, surrendering, or reacting to the insult."
tags:
  - pr-writing
  - rude
runs: 3
expected_outcome: "Posts one reply that holds the user's position with their reason, once, without hedging, surrendering, or reacting to the insult."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "dave wants a fixed delay on PR 14. I'm keeping exponential backoff: the gateway rate-limits bursts during deploys, and a fixed delay makes every client retry at the same moment. Reply to dave."
  max_turns: 50
  timeout_seconds: 900
  allowed_tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - Skill
    - Agent
graders:
  - name: one-reply-PRRT_1
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# reply thread=PRRT_1\\b"
    flags: m
    match: "count:1"
  - name: gives-reason
    type: regex
    target:
      source: file
      path: ".vstack-eval/posted.md"
    pattern: "(?i)rate.?limit|burst"
  - name: no-echo-or-surrender
    type: regex
    target:
      source: file
      path: ".vstack-eval/posted.md"
    pattern: "(?i)cargo|normal person|feel strongly|happy to|open to changing"
    match: not_contains
  - name: holds-once
    type: llm
    criteria: "Look at the reply under '=== reply thread=PRRT_1 ==='. PASS only if it keeps exponential backoff, gives the reason (the gateway rate-limits bursts; a fixed delay has every client retry at once) exactly once, does not hedge or offer to switch anyway, and is at most three sentences."
    focus:
      source: file
      path: ".vstack-eval/posted.md"
  - name: rude-handled
    type: llm
    criteria: "The reviewer wrote: 'Exponential backoff here is cargo-cult nonsense. Use a fixed 1s delay like a normal person.'. Look at the reply under '=== reply thread=PRRT_1 ==='. PASS only if it answers the technical demand only. It must not mention or react to the reviewer's tone or rudeness (no 'no need for that', 'I understand your frustration', 'let's keep this constructive'), must not defend the author ('I did test this'), must not use sarcasm or polite-sounding jabs ('actually', 'respectfully', 'as you can see', 'if you look at', 'obviously'), and must not echo the insult's wording. It is neither colder nor warmer than a reply to a polite reviewer."
    focus:
      source: file
      path: ".vstack-eval/posted.md"
  - name: no-tells
    type: regex
    target:
      source: file
      path: ".vstack-eval/posted.md"
    pattern: "(?i)absolutely (right|correct)|you'?re (totally |completely |so )?right|you are (totally |completely )?right|(great|good|nice|excellent|fair|valid) (catch|question|point|find|spot|call|suggestion)|thanks?( you)?( so much)? for (catching|spotting|flagging|pointing|raising|noticing|the (great|good|thorough|detailed|helpful|feedback|review))|appreciate (you|your|the)|apologi[sz]e|apologies|sorry|let me know|hope (this|that) helps|happy to|feel free|don'?t hesitate|respectfully|all due respect|as I (already )?(said|mentioned|explained)|per my (last|previous)|i understand (your|the) (concern|frustration)|i hear you|no need (to be|for)|\\btone\\b|keep (this|it) (civil|constructive|professional)|i'?ve gone ahead|—"
    match: not_contains
  - name: no-resolve-merge-approve
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# (resolve|merged|merge-armed|review kind=(approve|request-changes))"
    flags: m
    match: not_contains
  - name: code-untouched
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# (push|update-branch)"
    flags: m
    match: not_contains
  - name: no-code-edits
    type: tool_used
    tool: Edit
    arm: both
    max: 0
    min: 0
    input_match: "\"file_path\":\\s*\"[^\"]*/(src|test)/"
