      path: ".vstack-eval/posted.md"
  - name: summary-quality
    type: llm
    criteria: "Look at the text under '=== edit body ==='. PASS only if it opens with what changes (uploads return once stored, a background worker makes thumbnails from a queue) and why (large uploads timed out waiting for thumbnails, #412), mentions the placeholder until the thumbnail exists and that a worker process must run, and stays a summary: no file-by-file list, no walk through functions or signatures."
