      path: ".vstack-eval/posted.md"
    pattern: "```mermaid\\s*\\n\\s*(flowchart|graph|sequenceDiagram)"
  - name: one-diagram
    type: regex
    target:
      source: file
      path: ".vstack-eval/posted.md"
    pattern: "```mermaid"
    match: "count:1"
  - name: no-file-list
    type: regex
    target:
