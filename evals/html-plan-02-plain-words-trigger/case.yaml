schema_version: "1.1"
name: html-plan-02-plain-words-trigger
description: "Triggers html-plan from plain words, writes and packs one HTML plan, and stops for the user's response."
tags:
  - html-plan
runs: 3
expected_outcome: "Triggers html-plan from plain words, writes and packs one HTML plan, and stops for the user's response."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Before you build anything: I want to add rate limiting to the API client (a token bucket in src/, a config option and tests). Plan it first."
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - Skill
    - Agent
graders:
  - name: fires
    type: tool_used
    tool: Skill
    arm: both
    input_match: "\"skill\":\\s*\"(vstack:)?html-plan\""
    min: 1
  - name: no-source-edits
    type: tool_used
    tool: Edit
    arm: both
    max: 0
    min: 0
    input_match: "src/|test/"
  - name: no-source-writes
    type: tool_used
    tool: Write
    arm: both
    max: 0
    min: 0
    input_match: "\\\"file_path\\\":\\s*\\\"[^\\\"]*/(src|test)/"
  - name: packed
    type: regex
    target: trace
    pattern: "pack\\.mjs[^\\n]{0,400}\\.html"
