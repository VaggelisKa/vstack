schema_version: "1.1"
name: autonomous-merge-21-all-the-way-no-slash
description: "Plain words with no slash command pick up the skill, which merges. Merges once every gate passes."
tags:
  - autonomous-merge
  - merge-intent
  - trigger
  - smoke
runs: 3
expected_outcome: "Plain words with no slash command pick up the skill, which merges. Merges once every gate passes."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Take PR 14 all the way."
  max_turns: 150
  timeout_seconds: 2400
  allowed_tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - Skill
    - Agent
  append_system_prompt: "This is a non-interactive evaluation run in a sandbox: nobody will answer questions, no time passes between your polls, and there is no way to schedule a wake-up. Where a skill says to wait for the next poll, poll once more right away; if nothing changed, stop and write the final report as the skill describes."
graders:
  - name: init-merge
    type: regex
    target: trace
    pattern: "state\\.py\\\\?\\\"?\\s+init\\s+--pr\\s+14\\s+--merge"
  - name: gate-merge
    type: regex
    target: trace
    pattern: "gate\\.py\\\\?\\\"?\\s+14\\s+--merge"
  - name: armed-pinned-to-head
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^gh pr merge .*--match-head-commit[ =]?[0-9a-f]{40}"
    flags: m
  - name: merged-on-head
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# merged method=\\w+ head=[0-9a-f]{40}$"
    flags: m
  - name: no-admin
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "--admin\\b"
    flags: m
    match: not_contains
  - name: no-refused-merge
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# refused"
    flags: m
    match: not_contains
  - name: runs-babysit
    type: regex
    target: trace
    pattern: "\"skill\":\\s*\"vstack:babysit\""
  - name: babysit-not-asked-to-merge
    type: regex
    target: trace
    pattern: "\"skill\":\\s*\"vstack:babysit\",\\s*\"args\":\\s*\"(\\S+\\s+(--)?merge\\b|[^\"]*--merge\\b)"
    match: not_contains
  - name: fires
    type: tool_used
    tool: Skill
    arm: both
    input_match: "\"skill\":\\s*\"(vstack:)?autonomous-merge\""
    min: 1
