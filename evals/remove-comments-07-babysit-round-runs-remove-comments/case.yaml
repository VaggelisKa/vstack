name: remove-comments-07-babysit-round-runs-remove-comments
description: "After the combined diff review and before the single commit of the round, runs remove-comments on the PR branch without a new checkout, scoped to the lines the PR added (list --diff origin/main), deletes the narration and change-log comments, keeps the RFC fact, verifies, then commits once. The remove-comments report is not posted in PR replies."
