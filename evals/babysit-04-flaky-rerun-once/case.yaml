schema_version: "1.1"
name: babysit-04-flaky-rerun-once
description: "Triggers the skill without the word babysit, reruns the failed job once, and escalates if it fails again and also fails on base."
tags:
  - babysit
runs: 3
expected_outcome: "Triggers the skill without the word babysit, reruns the failed job once, and escalates if it fails again and also fails on base."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Keep an eye on PR 88 for me."
  max_turns: 80
  timeout_seconds: 1200
  allowed_tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - Skill
    - Agent
  append_system_prompt: "This is a non-interactive evaluation run in a sandbox: nobody will answer questions, no time passes between your polls, and there is no way to schedule a wake-up. Where a skill says to wait for the next poll, poll once more right away; if nothing changed, stop and write the final report as the skill describes."
graders:
  - name: reruns-once
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# rerun "
    flags: m
    match: "count:1"
  - name: checks-base
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^gh run list .*(--branch[ =]main|-b main)"
    flags: m
  - name: ci-config-untouched
    type: tool_used
    tool: Edit
    arm: both
    max: 0
    min: 0
    input_match: "\\.github/workflows"
  - name: no-push
    type: regex
    target:
      source: file
      path: ".vstack-eval/gh-calls.log"
    pattern: "^# push"
    flags: m
    match: not_contains
  - name: fires-on-plain-words
    type: tool_used
    tool: Skill
    arm: both
    input_match: "\"skill\":\\s*\"(vstack:)?babysit\""
    min: 1
